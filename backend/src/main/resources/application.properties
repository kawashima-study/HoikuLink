# アプリ
spring.application.name=hoikulink

# Spring Modulith
# モジュールごとにFlywayのマイグレーションを動かす
spring.modulith.runtime.flyway-enabled=true

# Flyway
# マイグレーションだけ、テーブルを作る権限のあるユーザーで接続する（手元の開発用）
spring.flyway.user=hoikulink_migrator
spring.flyway.password=localmigratorpassword

# ログ
# 各行に、リクエストごとのID（requestId）を出す。最後の \u0020 は半角スペース（行の終わりの空白は、エディタが自動で消すことがあるため）
logging.pattern.correlation=[%X{requestId:-}]\u0020
